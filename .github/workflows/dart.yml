# Flutter CI: analyze + unit tests on every PR to main.
# (This project is Flutter, not plain Dart — `dart pub get` cannot resolve
# the flutter_test SDK dependency, which is why the old template always failed.)

name: Dart

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Errors and warnings fail the build; pre-existing style infos do not.
      - name: Analyze project source
        run: flutter analyze

      - name: Run tests
        run: flutter test
