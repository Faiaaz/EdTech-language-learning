# Flutter CI: analyze + unit tests on every PR to main.
# (This project is Flutter, not plain Dart — `dart pub get` cannot resolve
# the flutter_test SDK dependency, which is why the old template always failed.)

name: Dart

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Errors fail the build. Warnings don't (yet): the repo carries ~21
      # pre-existing unused_field/unused_element warnings — once those are
      # cleaned up, drop --no-fatal-warnings to tighten this.
      - name: Analyze project source
        run: flutter analyze --no-fatal-warnings

      - name: Run tests
        run: flutter test
